# Economia y efectos divinos. Los costes altos se concentran en la ascension para mover capital sin castigar al jugador nuevo.
language: es_CL
economy:
  enabled: true
  weekly-upkeep:
    enabled: true
    grace-hours: 24
    check-minutes: 5
    # Se suma al 2.5% de lo invertido en habilidades del patron. Un arbol completo
    # requiere una ofrenda semanal relevante, mientras las ramas tempranas siguen accesibles.
    default-cost: 5000.0
    invested-percent: 2.5
    max-cost: 2500000.0
    costs:
      hephaestus: 5000.0
  treasury:
    enabled: true
    treasury-share-percent: 20
renunciation:
  cooldown-hours: 48
  confirmation-required: true
pvp:
  # Si las bendiciones siguen funcionando mientras hay combate contra otro jugador.
  # En false el panteon se apaga en cuanto empieza una pelea, que es lo que hacia que
  # nadie lo llevase a una: quitaba poderes justo cuando hacian falta.
  survival-powers-enabled: true
  # Cuanto se estira el enfriamiento de una bendicion usada en mitad del combate.
  # Evita que una habilidad de curacion sea un boton de reinicio y la pelea no acabe nunca.
  cooldown-multiplier: 2.0
  divine-arena:
    enabled: false
    region-id: pvpdivino
    progression-source: arena-only
convergence:
  # Permanente: no hay temporadas, reseteos de mundo ni propiedad de terreno.
  enabled: true
  anchors:
    # Se crean manualmente con /dioses ancla crear en plazas publicas ya construidas.
    max: 3
    minimum-offering: 25
    # Evita cambios de dominio por una diferencia minuscula de favor acumulado.
    dominance-margin: 250
  conflict:
    # Los poderes de dano entre jugadores siguen limitados al Region ID pvpdivino.
    arena-only: true
    region-id: pvpdivino
integrations:
  # DrakesBosses publishes BossVictoryEvent after it has resolved loot.
  # Existing deployments using integrations.odysseia.boss-rewards are read once
  # as a backwards-compatible fallback, but new configuration belongs here.
  drakesbosses:
    boss-rewards:
      enabled: true
      base-favor: 60
      minimum-favor: 15
      maximum-favor: 300
      multipliers:
        thor: 1.4
        odin: 1.6
        zeus: 1.6
        kratos: 1.8
        tifon: 2.0
      # Un patron gana favor extra cuando derrota un boss de su propio panteon.
      # Los IDs son los IDs internos de DrakesBosses, no nombres visibles ni comandos.
      matching-pantheon-bonus: 1.35
      affinities:
        thor: NORDIC
        odin: NORDIC
        loki: NORDIC
        heimdall: NORDIC
        zeus: GREEK
        kratos: GREEK
        tifon: GREEK
  auraskills: passive-statistics-only
  protections:
    respect-worldguard: true
    respect-protectionstones: true
  slimefun:
    enabled: true
    configured-items-only: true
    pulso-de-red:
      radius: 6
      max-machines: 3
      # Se aplica seis veces por activacion: 24.576 J por maquina y hasta
      # 73.728 J si Hefesto encuentra los tres consumidores permitidos.
      energy-per-machine-per-pulse: 4096
      interval-seconds: 5
      allowed-item-ids:
        # LiteXpansion: consumidores industriales reales de 16.666 y 50.000 J/s.
        - MASS_FABRICATOR_MACHINE
        - UU_CRAFTER
hephaestus:
  ojo-de-mena:
    radius: 8
    max-markers: 24
visuals:
  # Display Entities nativas de Paper: no resource pack, no mod y siempre con limpieza programada.
  display-entities:
    enabled: true
    # Floodgate/Bedrock conserva particulas y sonidos; activa esto solo despues de validar displays en movil.
    bedrock-enabled: false
    max-displays-per-scene: 8
    view-range: 32
casting:
  # El Foco Divino evita que ataques mitologicos interfieran con bloques, menus o maquinas.
  focus-material: AMETHYST_SHARD
