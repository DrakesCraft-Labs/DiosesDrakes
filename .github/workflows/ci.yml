name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar API de DrakesBosses
        shell: bash
        run: |
          git clone --depth 1 https://github.com/DrakesCraft-Labs/DrakesBosses.git ../DrakesBosses
          mvn -B -ntp -f ../DrakesBosses/pom.xml install -DskipTests

      - name: Clonar dependencias DrakesCraft Maven Repo
        run: |
          mkdir -p ~/.m2/repository
          git clone --depth 1 https://github.com/DrakesCraft-Labs/maven-repo.git /tmp/drakes-maven-repo
          cp -rn /tmp/drakes-maven-repo/com ~/.m2/repository/ || true
          python3 -c "
          import os, shutil
          repo = os.path.expanduser('~/.m2/repository/com/github/drakescraft_labs')
          if os.path.exists(repo):
              for d in os.listdir(repo):
                  dp = os.path.join(repo, d)
                  if os.path.isdir(dp):
                      for v in list(os.listdir(dp)):
                          vp = os.path.join(dp, v)
                          if os.path.isdir(vp) and not v.endswith('-SNAPSHOT'):
                              snap_v = v + '-SNAPSHOT'
                              snap_p = os.path.join(dp, snap_v)
                              if not os.path.exists(snap_p):
                                  shutil.copytree(vp, snap_p)
                                  for f in os.listdir(snap_p):
                                      if v in f:
                                          os.rename(os.path.join(snap_p, f), os.path.join(snap_p, f.replace(v, snap_v)))
          "

      - name: Compilar y ejecutar pruebas
        run: |
          if [ -f pom.xml ]; then
            echo "Compilando con Maven"
            mvn -B -ntp package -DskipTests
          elif [ -f gradlew ]; then
            echo "Compilando con Gradle Wrapper"
            chmod +x gradlew
            ./gradlew build -x test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Compilando con Gradle"
            gradle build -x test
          fi

      - name: Validar artefacto Paper
        shell: bash
        run: |
          JAR=$(find target build/libs -maxdepth 2 -type f -name 'dioses-drakes-*.jar' ! -name 'original-*' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'cl/drakescraft/diosesdrakes/DiosesDrakes.class'

      - name: Publicar JAR validado
        uses: actions/upload-artifact@v4
        with:
          name: DiosesDrakes
          path: target/dioses-drakes-*.jar
          if-no-files-found: error
